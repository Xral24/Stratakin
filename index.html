<!DOCTYPE html>
<html lang="en">

<title>Stratakin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22Stratakin%22%2C%20%22short_name%22%3A%20%22Stratakin%22%2C%20%22start_url%22%3A%20%22./index.html%22%2C%20%22display%22%3A%20%22fullscreen%22%2C%20%22orientation%22%3A%20%22portrait%22%2C%20%22background_color%22%3A%20%22%2307090f%22%2C%20%22theme_color%22%3A%20%22%2307090f%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22icon-180.png%22%2C%20%22sizes%22%3A%20%22180x180%22%2C%20%22type%22%3A%20%22image/png%22%7D%5D%7D">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root { --ui: #f4f1ea; --bg: rgba(14, 16, 24, 0.82); --bg2: rgba(28, 32, 46, 0.95); --acc: #7ad7ff; --good: #5ad66a; --bad: #ff6b5a; --font: 'Nunito', system-ui, sans-serif; --pix: 'Silkscreen', monospace; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ui); font-family: var(--font); -webkit-user-select: none; user-select: none; touch-action: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font-family: var(--font); color: var(--ui); }
#crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,0.9) 0 1.5px, transparent 2px), linear-gradient(#fff,#fff) center/2px 100% no-repeat, linear-gradient(#fff,#fff) center/100% 2px no-repeat; opacity: 0.8; mix-blend-mode: difference; }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.8) 100%); opacity: 0.1; transition: opacity .6s; }
#hurt { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,30,20,0.9) 100%); opacity: 0; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#hud-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 10px; gap: 8px; }
#status { display: flex; flex-direction: column; gap: 5px; flex: 1 1 0; min-width: 0; }
#status > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hearts { display: flex; gap: 3px; }
#hearts i { width: 12px; height: 12px; background: #3a1f24; border: 1px solid #000; border-radius: 2px; }
#hearts i.on { background: #ff4d5a; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
#breath { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-family: var(--pix); font-size: 11px; color: #bfeaff; text-shadow: 0 1px 0 #000; }
#breath .track { width: 160px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 7px; overflow: hidden; }
#breath-fill { height: 100%; background: #6fd1f2; }
#breath.low { color: #ff8a7a; animation: blink .6s infinite; }
#breath.low #breath-fill { background: #ff6b5a; }
@keyframes blink { 50% { opacity: .35; } }
#trainer { display: flex; align-items: center; gap: 6px; font-family: var(--pix); font-size: 11px; text-shadow: 0 1px 0 #000; white-space: nowrap; }
.xpbar { width: 90px; height: 6px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; }
.xpbar > div { height: 100%; background: var(--acc); }
#where { font-family: var(--pix); font-size: 10px; text-shadow: 0 1px 0 #000, 0 0 6px #000; white-space: nowrap; opacity: .9; }
#buttons { display: grid; grid-template-columns: auto auto auto; gap: 5px; pointer-events: auto; justify-content: end; flex: 0 0 auto; }
.hbtn { background: var(--bg); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 7px 10px; font-weight: 800; font-size: 13px; }
.hbtn span { color: var(--acc); }
#quest-dot { color: var(--good); }
#quest-hint { position: absolute; left: calc(10px + env(safe-area-inset-left)); top: calc(118px + env(safe-area-inset-top)); transform: none; font-size: 12px; background: var(--bg); padding: 4px 10px; border-radius: 10px; max-width: calc(100vw - 132px); text-align: left; border: 1px solid rgba(255,255,255,.15); }
#mine-bar { position: absolute; left: 50%; top: 56%; width: 80px; height: 6px; margin-left: -40px; background: rgba(0,0,0,.6); border-radius: 3px; overflow: hidden; }
#mine-fill { height: 100%; background: #fff; }
#hotbar { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 5px; pointer-events: auto; max-width: 92vw; overflow-x: auto; padding: 4px; scrollbar-width: none; }
#hotbar::-webkit-scrollbar { display: none; }
.slot { flex: 0 0 auto; width: 44px; height: 44px; background: var(--bg); border: 2px solid rgba(255,255,255,.25); border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; }
.slot.sel { border-color: #fff; background: rgba(60,70,90,.9); }
.slot .ico { width: 22px; height: 22px; border-radius: 4px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.2); }
.slot span { position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 800; text-shadow: 0 1px 0 #000; }
#item-name { position: absolute; left: 50%; bottom: calc(66px + env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 12px; text-shadow: 0 1px 2px #000; white-space: nowrap; }
#touch-ui { position: absolute; inset: 0; pointer-events: none; }
#joy { position: absolute; left: 26px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.35); }
#joy.active { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.6); }
#joy-knob { position: absolute; left: 33px; top: 33px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
#joy::after { content: '◀ ▶'; position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-size: 10px; letter-spacing: 36px; padding-left: 36px; opacity: .35; pointer-events: none; }
#btn-jump { position: absolute; right: 18px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); font-size: 24px; pointer-events: auto; }
#btn-sneak { position: absolute; right: 96px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.4); font-size: 20px; pointer-events: auto; }
#btn-sneak.on { background: rgba(122,215,255,.5); }
#hud.in-battle #hotbar, #hud.in-battle #item-name, #hud.in-battle #touch-ui, #hud.in-battle #quest-hint, #hud.in-battle #mine-bar, #hud.in-battle #drop-bar, #hud.in-battle #look { display: none; }
#toasts { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: 90vw; }
.toast { background: var(--bg2); border: 1px solid rgba(255,255,255,.2); border-left: 4px solid var(--acc); padding: 8px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(-6px); transition: all .3s; max-width: 100%; text-align: center; }
.toast.show { opacity: 1; transform: none; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }

/* Battle sheet */
#battle { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg2); border-top: 2px solid rgba(255,255,255,.2); border-radius: 16px 16px 0 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); max-height: 60vh; display: flex; flex-direction: column; gap: 8px; font-size: 14px; overflow-y: auto; }
#battle.snaring #b-actions { display: none; }
#battle.snaring #b-log { max-height: 40px; min-height: 0; }
.b-head { display: flex; gap: 8px; }
.b-card { flex: 1; background: rgba(0,0,0,.35); border-radius: 10px; padding: 6px 8px; }
.b-card.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-6px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(4px) } }
.b-name { display: flex; justify-content: space-between; font-weight: 800; }
.b-name .lv { opacity: .8; font-weight: 600; }
.hpbar { height: 9px; background: rgba(0,0,0,.6); border-radius: 5px; overflow: hidden; margin: 5px 0 4px; }
.hpfill { height: 100%; transition: width .4s; }
.elems { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 11px; }
.hpnum { margin-left: auto; opacity: .85; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: 800; color: #111; }
#b-mine .xpbar { width: 100%; margin-top: 4px; height: 4px; }
#b-log { min-height: 52px; max-height: 84px; overflow: hidden; font-size: 13px; line-height: 1.35; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px 8px; }
#b-log .good { color: var(--good); } #b-log .bad { color: #ffb0a6; }
#b-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#b-actions .act { min-height: 46px; padding: 5px 7px; }
.act { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-left: 4px solid var(--c, rgba(255,255,255,.4)); border-radius: 8px; padding: 7px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 52px; position: relative; }
.act:disabled { opacity: .45; }
.act b { font-size: 13px; } .act small { opacity: .75; font-size: 11px; }
.act .eff { position: static; align-self: flex-start; font-size: 10px; font-style: normal; font-weight: 800; line-height: 1; padding: 2px 5px; border-radius: 6px; background: rgba(0,0,0,.3); margin-top: 1px; }
.act b { line-height: 1.15; overflow-wrap: anywhere; }
.eff.good { color: var(--good); } .eff.bad { color: #ffb0a6; }
.swaplist { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.swaplist p { grid-column: 1 / -1; margin: 0; opacity: .8; font-size: 12px; }
#b-snare { background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; align-items: center; cursor: pointer; }
.snare-track { position: relative; width: 100%; height: 30px; background: rgba(255,255,255,.1); border-radius: 11px; overflow: hidden; }
.snare-zone { position: absolute; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(127,224,192,.5), rgba(127,224,192,.95), rgba(127,224,192,.5)); }
.snare-marker { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 6px #fff; }
.snare-marker.ok { background: var(--good); } .snare-marker.bad { background: var(--bad); }
#snare-go { background: #7fe0c0; color: #0a2a22; border: 0; border-radius: 10px; padding: 12px 26px; font-weight: 800; font-size: 16px; }
.snare-tip { font-size: 11px; opacity: .7; }

/* Panels */
#panel { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
#panel-box { width: 100%; max-width: 560px; max-height: 88vh; background: var(--bg2); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.15); }
@media (min-width: 700px) { #panel { align-items: center; } #panel-box { border-radius: 16px; max-height: 84vh; } }
#panel-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.12); font-family: var(--pix); font-size: 13px; }
#panel-close { background: none; border: 0; font-size: 20px; padding: 4px 8px; }
#panel-body { overflow-y: auto; padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); font-size: 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#panel-body h4 { margin: 14px 0 6px; font-family: var(--pix); font-size: 11px; opacity: .85; }
.note { font-size: 12px; opacity: .75; margin: 0 0 10px; }
.small { font-size: 12px; opacity: .8; }
.kcard { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
.kcard.empty { justify-content: center; min-height: 80px; opacity: .7; border-style: dashed; }
.kcard canvas { flex: 0 0 auto; background: rgba(0,0,0,.3); border-radius: 8px; }
.kinfo { flex: 1; min-width: 0; }
.krow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.krow .lv { margin-left: auto; opacity: .8; }
.tag { font-size: 10px; background: var(--acc); color: #06202c; padding: 1px 6px; border-radius: 8px; font-weight: 800; }
.tag.myth { background: #ff9fe0; }
.gen { font-size: 10px; opacity: .7; margin-left: auto; }
.detail { display: flex; gap: 12px; align-items: flex-start; }
.detail canvas { background: rgba(0,0,0,.3); border-radius: 10px; flex: 0 0 auto; }
.elemmix { display: flex; gap: 3px; margin-top: 6px; }
.elemmix .badge { text-align: center; overflow: hidden; white-space: nowrap; min-width: 0; }
.stats { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.stat { display: grid; grid-template-columns: 64px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; }
.sbar { height: 8px; background: rgba(0,0,0,.4); border-radius: 4px; overflow: hidden; }
.sbar > div { height: 100%; background: linear-gradient(90deg, #7ad7ff, #5ad66a); }
.stat b { text-align: right; }
.moverow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-left: 4px solid var(--c); background: rgba(255,255,255,.05); border-radius: 6px; margin-bottom: 5px; font-size: 13px; }
.moverow span { opacity: .75; font-size: 12px; text-align: right; }
.row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--acc); color: #06202c; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 800; font-size: 14px; }
.btn.big { font-size: 17px; padding: 13px 26px; }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--ui); border: 1px solid rgba(255,255,255,.25); }
.btn:disabled { opacity: .4; }
input { font-family: var(--font); font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.3); color: var(--ui); -webkit-user-select: text; user-select: text; }
.recipe { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
.recipe.can { border-color: rgba(90,214,106,.5); }
.ico.big { width: 36px; height: 36px; border-radius: 8px; flex: 0 0 auto; box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.2); }
.rinfo { flex: 1; min-width: 0; }
.needs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; }
.needs .ok { color: var(--good); } .needs .no { color: #ffb0a6; }
.quest { background: rgba(255,255,255,.05); border-left: 4px solid rgba(255,255,255,.2); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.quest.current { border-left-color: var(--acc); background: rgba(122,215,255,.08); }
.quest.done { opacity: .6; border-left-color: var(--good); }
.quest.locked { opacity: .4; }
.quest.bounty { border-left-color: #f0c040; }
.qbar { height: 6px; background: rgba(0,0,0,.4); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.qbar > div { height: 100%; background: var(--acc); }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu p { margin: 4px 0; }
code { font-family: var(--pix); font-size: 11px; }
.fslots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.fslots .kcard { flex-direction: column; text-align: center; margin: 0; }
.fslots .kcard .krow { justify-content: center; }
.fslots .kcard .lv { margin-left: 0; }
.plus { font-size: 26px; font-weight: 800; opacity: .6; }
.ingr { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.chip { font-size: 12px; font-weight: 800; color: #111; padding: 4px 9px; border-radius: 12px; }
.chip.dis { opacity: .4; }

/* Start */
#start { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1d2a44 0%, #07090f 70%); display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; touch-action: pan-y; }
#start-box { text-align: center; max-width: 520px; width: 100%; }
#start h1 { font-family: var(--pix); font-size: 34px; margin: 0; letter-spacing: 4px; color: var(--acc); text-shadow: 0 4px 0 #0a3a4a, 0 0 30px rgba(122,215,255,.4); }
#start .tag { font-size: 15px; opacity: .85; margin: 10px 0 22px; }
#start-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#starter-pick p { margin: 18px 0 8px; font-family: var(--pix); font-size: 12px; }
#starters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.starter { background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 140px; }
.starter:hover, .starter:active { border-color: var(--acc); background: rgba(122,215,255,.12); }
.starter canvas { background: rgba(0,0,0,.35); border-radius: 10px; }
.starter small { opacity: .7; font-size: 11px; }
.how { font-size: 12px; opacity: .6; margin-top: 26px; }
#loading { position: fixed; inset: 0; background: #07090f; display: flex; align-items: center; justify-content: center; font-family: var(--pix); font-size: 14px; color: var(--acc); z-index: 50; }

.fgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 340px; margin: 0 auto 10px; }
.fcell { aspect-ratio: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; overflow: hidden; }
.fcell.empty { color: rgba(255,255,255,.35); font-size: 26px; border-style: dashed; }
.fcell canvas { width: 56px; height: 56px; }
.fcell .flv { font-size: 10px; opacity: .85; text-align: center; line-height: 1.1; }
.fcell.item .ico.big { width: 30px; height: 30px; }
.trait { background: rgba(122,215,255,.1); border-left: 3px solid var(--acc); padding: 5px 8px; border-radius: 6px; font-size: 12px; margin-top: 6px; }
.slot.obj .ico { border-radius: 50%; }

#tutorial { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--bg2); border: 1px solid rgba(255,255,255,.25); border-radius: 14px; padding: 14px 16px; width: min(92vw, 420px); font-size: 14px; z-index: 20; display: flex; flex-direction: column; gap: 7px; pointer-events: auto; }
#tutorial b { font-family: var(--pix); font-size: 12px; margin-bottom: 4px; }
.tut-row { display: flex; gap: 10px; align-items: center; }
.tut-row .k { display: inline-block; min-width: 26px; text-align: center; background: rgba(255,255,255,.12); border-radius: 6px; padding: 2px 6px; font-weight: 800; font-size: 12px; }
#tutorial .btn { align-self: flex-end; margin-top: 6px; }

#dialogue { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 520px); background: var(--bg2); border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 12px 14px; pointer-events: auto; z-index: 15; }
.dlg-who { font-family: var(--pix); font-size: 11px; color: var(--acc); margin-bottom: 4px; }
.dlg-text { font-size: 15px; line-height: 1.4; }
.dlg-more { font-size: 11px; opacity: .6; margin-top: 6px; text-align: right; }
.shop-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
.shop-row .price { font-family: var(--pix); font-size: 12px; margin-left: auto; white-space: nowrap; }
.usebar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.rar { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 800; vertical-align: middle; color: #111; }
.rar.r1 { background: #8fd7a0; } .rar.r2 { background: #7ab8ff; } .rar.r3 { background: #c98bff; } .rar.r4 { background: #ffb347; }

// Shared helpers: hashing, seeded RNG, periodic value noise, small mat4 library.

'use strict';
// Several saved games side by side: an index in localStorage and one entry per game. Starting a new world never touches another game.
const Saves = (() => {
  const INDEX = 'stratakin-games', LEGACY = 'strata-save-v1';
  function read() { try { const a = JSON.parse(localStorage.getItem(INDEX)); return Array.isArray(a) ? a : null; } catch (e) { return null; } }
  function write(list) { try { localStorage.setItem(INDEX, JSON.stringify(list)); } catch (e) {} }
  const levelFor = (xp) => Math.floor(Math.sqrt((xp || 0) / 40)) + 1;
  function summary(entry, d) {
    entry.seed = d.seed; entry.worldId = d.worldId || 'earth'; entry.level = levelFor(d.xp); entry.kin = (d.kin || []).length; entry.shards = d.shards || 0;
    entry.villages = Object.keys(d.villageState || {}).filter(k => d.villageState[k] && d.villageState[k].freed).length; entry.days = d.dayCount || 0; entry.t = Date.now();
    const lv = d.lastVillage && d.lastVillage.name; if (lv) entry.place = lv;
    return entry;
  }
  function list() {
    let l = read() || [];
    // the single old save (from before the games list) is adopted as Game 1 whenever it is there and not yet listed
    if (!l.some(x => x.key === LEGACY)) {
      try { const raw = localStorage.getItem(LEGACY); if (raw) { const d = JSON.parse(raw); if (d && d.seed) { l.push(summary({ id: 'v1', key: LEGACY, name: 'Game 1', created: Date.now() }, d)); write(l); } } } catch (e) {}
    }
    if (!read()) write(l);
    return l.slice().sort((a, b) => (b.t || 0) - (a.t || 0));
  }
  function get(id) { return list().find(x => x.id === id) || null; }
  function create(name) {
    const l = list(); const id = 'g' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    const e = { id, key: 'strata-save-' + id, name: (name || '').trim().slice(0, 24) || ('Game ' + (l.length + 1)), created: Date.now(), t: Date.now() };
    l.push(e); write(l); return e;
  }
  function touch(id, data) { const l = list(); const e = l.find(x => x.id === id); if (!e) return; summary(e, data); write(l); }
  function rename(id, name) { const l = list(); const e = l.find(x => x.id === id); if (!e) return; e.name = (name || '').trim().slice(0, 24) || e.name; write(l); }
  function remove(id) { const l = list(); const e = l.find(x => x.id === id); if (!e) return; try { localStorage.removeItem(e.key); } catch (err) {} write(l.filter(x => x.id !== id)); }
  function when(t) { if (!t) return ''; const d = new Date(t); const now = new Date(); const sameDay = d.toDateString() === now.toDateString(); return sameDay ? 'today ' + d.toTimeString().slice(0, 5) : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toTimeString().slice(0, 5); }
  return { list, get, create, touch, rename, remove, when, LEGACY };
})();

    if (gl0 > 0.01) { state.zenith = U.mixColor(state.zenith, [0.28, 0.27, 0.32], gl0 * 0.85); state.clouds = Math.min(1, state.clouds + 0.45 * gl0); state.sunAmt *= 1 - 0.65 * gl0; state.sunCol = U.mixColor(state.sunCol, [0.75, 0.72, 0.8], gl0 * 0.6); }
    state.skyPass = true; state.night = 1 - day;
    sky = horizon;
    state.skyColor = sky; state.fogColor = sky; state.ambient = 0.06;
    state.fogNear = state.viewDist * 0.55 * (world.preset.fogMul || 1); state.fogFar = state.viewDist * 0.98 * (world.preset.fogMul || 1);
    if (wi > 0.02 && wk === 'fog') { state.fogNear = U.lerp(state.fogNear, 4, wi); state.fogFar = U.lerp(state.fogFar, 26, wi); }
    if (gl0 > 0.01) { state.fogNear = U.lerp(state.fogNear, state.viewDist * 0.32, gl0); state.fogFar = U.lerp(state.fogFar, state.viewDist * 0.88, gl0); }
    else if (wi > 0.02 && (wk === 'rain' || wk === 'storm')) { state.fogNear = U.lerp(state.fogNear, state.viewDist * 0.3, wi); state.fogFar = U.lerp(state.fogFar, state.viewDist * 0.75, wi); }
    state.tint = [1, 1, 1]; state.underwater = false; state.inCore = false;
    const eyeBlock = world.getBlock(Math.floor(player.x), Math.floor(player.y + 1.62), Math.floor(player.z));
    if (eyeBlock === B.WATER || eyeBlock === B.BRINE || eyeBlock === B.LAVA || player.y < CORE_TOP || player.y < world.topAt(Math.floor(player.x), Math.floor(player.z)) - 2) state.skyPass = false;
    if (eyeBlock === B.WATER) { state.underwater = true; state.fogColor = [0.05, 0.2, 0.45]; state.skyColor = state.fogColor; state.fogNear = 2; state.fogFar = 18; state.tint = [0.6, 0.8, 1.0]; }
    else if (eyeBlock === B.BRINE) { state.underwater = true; state.fogColor = [0.35, 0.42, 0.08]; state.skyColor = state.fogColor; state.fogNear = 1; state.fogFar = 9; state.tint = [0.9, 1.0, 0.5]; }
    else if (eyeBlock === B.LAVA) { state.fogColor = [0.9, 0.3, 0.05]; state.skyColor = state.fogColor; state.fogNear = 0.5; state.fogFar = 4; state.tint = [1.2, 0.6, 0.3]; }
    else if (player.y < CORE_TOP) { state.inCore = true; state.fogColor = [0.16, 0.04, 0.01]; state.skyColor = state.fogColor; state.fogNear = 8; state.fogFar = 46; state.ambient = 0.46; state.tint = [1.1, 0.88, 0.8]; }
    else if (player.y < world.topAt(Math.floor(player.x), Math.floor(player.z)) - 2) { state.fogColor = [0.0, 0.0, 0.0]; state.skyColor = state.fogColor; state.fogNear = 10; state.fogFar = 48; }
  }

  function render(world, player, entities, cam, extras) {
    resize();
    setEnv(world, player);
    const sc = state.skyColor;
    gl.clearColor(sc[0], sc[1], sc[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const aspect = canvas.width / canvas.height;
    if (state.skyPass && skyProg) { // the sky behind everything
      gl.useProgram(skyProg); gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
      const f = U.forwardVec(cam.yaw, cam.pitch); const r = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)]; const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
      gl.uniform3fv(sloc.uFwd, f); gl.uniform3fv(sloc.uRight, r); gl.uniform3fv(sloc.uUp, u); gl.uniform1f(sloc.uTan, Math.tan(cam.fov / 2)); gl.uniform1f(sloc.uAspect, aspect);
      gl.uniform3fv(sloc.uHorizon, state.fogColor); gl.uniform3fv(sloc.uZenith, state.zenith); gl.uniform3fv(sloc.uSun, state.sun); gl.uniform3fv(sloc.uSunCol, state.sunCol); gl.uniform1f(sloc.uSunAmt, state.sunAmt); gl.uniform1f(sloc.uTime, performance.now() / 1000); gl.uniform1f(sloc.uClouds, state.clouds); gl.uniform1f(sloc.uNight, state.night);
      gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.enableVertexAttribArray(sloc.aPos); gl.vertexAttribPointer(sloc.aPos, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.disableVertexAttribArray(sloc.aPos);
      gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    }
    const proj = U.m4perspective(cam.fov, aspect, 0.08, 400);
    const view = U.m4view(cam.x, cam.y, cam.z, cam.yaw, cam.pitch);
    const pv = U.m4mul(proj, view);
    const planes = U.frustumPlanes(pv);
    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.uPV, false, pv);
    gl.uniform1f(loc.uTime, performance.now() / 1000);
    gl.uniform3f(loc.uCam, cam.x, cam.y, cam.z);
    gl.uniform1f(loc.uDay, state.dayLight);
    gl.uniform3fv(loc.uFog, state.fogColor);
    gl.uniform1f(loc.uFogNear, state.fogNear); gl.uniform1f(loc.uFogFar, state.fogFar);
    gl.uniform1f(loc.uAmbient, state.ambient);
    gl.uniform3fv(loc.uTint, state.tint);
    gl.uniform1f(loc.uSkyMul, 1);
    gl.uniform3fv(loc.uSun, state.sun || [0, 1, 0]); gl.uniform3fv(loc.uSunCol, state.sunCol || [1, 1, 1]); gl.uniform3fv(loc.uZenith, state.zenith || state.fogColor); gl.uniform1f(loc.uSunAmt, state.skyPass ? state.sunAmt : 0); gl.uniform1f(loc.uQuality, isMobile ? 0.6 : 1); gl.uniform1f(loc.uGrid, 1); gl.uniform3f(loc.uPlayer, player.x, player.y, player.z);
    // lights
    const L = new Float32Array(24), LR = new Float32Array(8);
    const lights = extras.lights || [];
    for (let i = 0; i < 8; i++) { const l = lights[i]; if (l) { L[i * 3] = l[0]; L[i * 3 + 1] = l[1]; L[i * 3 + 2] = l[2]; LR[i] = l[3]; } else { L[i * 3 + 1] = -999; LR[i] = 0.001; } }
    gl.uniform3fv(loc.uLights, L); gl.uniform1fv(loc.uLightR, LR);
    gl.uniform1f(loc.uAlpha, 1); gl.uniform1f(loc.uWave, 0);
    const ident = U.m4identity();
    // opaque chunks
    const visible = [];
    const half = CH / 2, rad = Math.hypot(half, WH / 2, half);
    for (const c of world.chunks.values()) {
      if (!c.mesh) continue;
      const mx = c.cx * CH + half, mz = c.cz * CH + half;
      const dx = mx - cam.x, dz = mz - cam.z;
      if (dx * dx + dz * dz > (state.viewDist + 16) * (state.viewDist + 16)) continue;
      if (!U.sphereInFrustum(planes, mx, WH / 2, mz, rad)) continue;
      visible.push(c);
    }
    gl.depthMask(true); gl.disable(gl.BLEND);
    for (const c of visible) if (c.mesh.op) { ident[12] = c.cx * CH; ident[14] = c.cz * CH; gl.uniformMatrix4fv(loc.uModel, false, ident); drawMesh(c.mesh.op); }
    drawGrass(world, player, pv, cam);
    gl.useProgram(prog); gl.uniformMatrix4fv(loc.uPV, false, pv);
    // grass: blades within reach, swaying (fallback without instancing)
    gl.uniform1f(loc.uGrid, 0); gl.uniform1f(loc.uWave, 2);
    const gR = (isMobile ? 34 : 48) + 16;
    for (const c of visible) if (c.mesh.gr) { const dx = c.cx * CH + 8 - cam.x, dz = c.cz * CH + 8 - cam.z; if (dx * dx + dz * dz > gR * gR) continue; ident[12] = c.cx * CH; ident[14] = c.cz * CH; gl.uniformMatrix4fv(loc.uModel, false, ident); drawMesh(c.mesh.gr); }
    gl.uniform1f(loc.uWave, 0);
    // entities
    for (const e of entities) {
      if (!e.mesh || !e.mesh.count) continue;
      const d2 = (e.x - cam.x) ** 2 + (e.z - cam.z) ** 2; if (d2 > state.viewDist * state.viewDist) continue;
      gl.uniform1f(loc.uSkyMul, e.skyMul == null ? 1 : e.skyMul);
      gl.uniformMatrix4fv(loc.uModel, false, U.m4model(e.x, e.y + (e.hover || 0), e.z, e.yaw, e.scale || 1));
      drawMesh(e.mesh);
    }
    gl.uniform1f(loc.uSkyMul, 1);
    // water
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    gl.uniform1f(loc.uAlpha, 0.62); gl.uniform1f(loc.uWave, 1);
    for (const c of visible) if (c.mesh.wa) { ident[12] = c.cx * CH; ident[14] = c.cz * CH; gl.uniformMatrix4fv(loc.uModel, false, ident); drawMesh(c.mesh.wa); }
    gl.uniform1f(loc.uWave, 0); gl.uniform1f(loc.uAlpha, 0.38);
    for (const c of visible) if (c.mesh.gs) { ident[12] = c.cx * CH; ident[14] = c.cz * CH; gl.uniformMatrix4fv(loc.uModel, false, ident); drawMesh(c.mesh.gs); }
    gl.depthMask(true);
    // lines
    if (extras.lines && extras.lines.length) {
      gl.useProgram(lineProg);
      gl.uniformMatrix4fv(lloc.uPV, false, pv);
      gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
      for (const seg of extras.lines) {
        gl.bufferData(gl.ARRAY_BUFFER, seg.data, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(lloc.aPos); gl.vertexAttribPointer(lloc.aPos, 3, gl.FLOAT, false, 0, 0);
        gl.uniform4fv(lloc.uColor, seg.color);
        gl.drawArrays(gl.LINES, 0, seg.data.length / 3);
      }
    }
    gl.disable(gl.BLEND);
  }

  // helpers to build line sets
  function boxLines(x, y, z, pad = 0.003) {
    const a = x - pad, b = y - pad, c = z - pad, d = x + 1 + pad, e = y + 1 + pad, f = z + 1 + pad;
    return new Float32Array([a, b, c, d, b, c, d, b, c, d, b, f, d, b, f, a, b, f, a, b, f, a, b, c, a, e, c, d, e, c, d, e, c, d, e, f, d, e, f, a, e, f, a, e, f, a, e, c, a, b, c, a, e, c, d, b, c, d, e, c, d, b, f, d, e, f, a, b, f, a, e, f]);
  }
  function ringLines(x, y, z, r, segs = 28) {
    const out = new Float32Array(segs * 6);
    for (let i = 0; i < segs; i++) {
      const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
      out[i * 6] = x + Math.cos(a0) * r; out[i * 6 + 1] = y; out[i * 6 + 2] = z + Math.sin(a0) * r;
      out[i * 6 + 3] = x + Math.cos(a1) * r; out[i * 6 + 4] = y; out[i * 6 + 5] = z + Math.sin(a1) * r;
    }
    return out;
  }

  return { grassZone, init, resize, buildChunk, freeChunk, entityMesh, render, boxLines, ringLines, state, get gl() { return gl; } };
})();

    if (mineE && mineE.hitT > 0) mineE.hitT -= dt;
    if (wildE && wildE.hitT > 0) wildE.hitT -= dt;
  }
  function abort() { if (!active) return; const e = wildE; end('ran'); if (e) e.cool = 60; } // test hook: walk away from a fight
  return { init, start, tick, camera, fxEntities, spawnFx, abort, get active() { return active; }, get mineEntity() { return mineE; }, get wildEntity() { return wildE; } };
})();

const Quests = (() => {
  let G = null;
  function init(game) { G = game; if (!G.questState) G.questState = { index: 0, bounty: { need: 3, done: 0, round: 1 } }; }
  function current() { return QUESTS[G.questState.index] || null; }
  function update() {
    const q = current();
    const events = [];
    if (q) {
      const p = q.check(G);
      if (p >= 1) {
        G.questState.index++;
        giveReward(q.reward);
        events.push({ type: 'quest', q });
      }
    }
    const b = G.questState.bounty;
    if (G.stats.battlesWon - (b.base || 0) >= b.need) {
      b.base = G.stats.battlesWon; b.round++; b.need = 3 + b.round;
      giveReward({ items: { snare: 1 }, xp: 20 * b.round });
      events.push({ type: 'bounty', round: b.round });
    }
    return events;
  }
  function giveReward(r) {
    if (!r) return;
    if (r.items) for (const k in r.items) G.player.add(k, r.items[k]);
    if (r.xp) G.addTrainerXp(r.xp);
  }
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  function dirTo(dx, dz) { const ang = Math.atan2(dx, -dz); return dirs[Math.round(((ang / (Math.PI * 2)) + 1) * 8) % 8]; }
  let treeHint = { t: 0, text: '' };
  function hintText() {
    const q = current();
    if (!q) return 'Three worlds, a dome, a legend. Whatever is left is yours to find.';
    let t = q.hint;
    if (q.id === 'village' && (Village.def || G.village)) { const v = Village.def || G.village, dx = v.x - G.player.x, dz = v.z - G.player.z; t += ` · ${Math.round(Math.hypot(dx, dz))}m ${dirTo(dx, dz)}`; }
    if (q.id === 'fuse' || q.id === 'snare') {
      const b = G.world.findNearest(B.FUSION, G.player.x, G.player.z, 80);
      if (b && q.id === 'fuse') t += ` · table ${Math.round(Math.hypot(b.x - G.player.x, b.z - G.player.z))}m ${dirTo(b.x - G.player.x, b.z - G.player.z)}`;
    }
    if (q.id === 'timber' || q.id === 'ember' || q.id === 'void') {
      const now = performance.now();
      if (now - treeHint.t > 2000) {
        treeHint.t = now;
        const id = q.id === 'timber' ? B.LOG : q.id === 'ember' ? B.GLOWWORM : B.VOID;
        const b = G.world.findNearest(id, G.player.x, G.player.z, q.id === 'timber' ? 64 : q.id === 'ember' ? 80 : 40) || (q.id === 'ember' ? G.world.findNearest(B.EMBER, G.player.x, G.player.z, 40) : null);

// Fishing: hold a rod, face the water and tap to cast. A bite comes after a while; then a marker runs along a bar and you tap when

const Fishing = (() => {

  }

// World hazards that are not Kin: the worms under the Moon's Mare, the stones Halo's ring drops. Both show themselves before they strike;

  function puff(x, y, z, n, col) { for (let i = 0; i < n; i++) fx.push({ x: x + (Math.random() - 0.5) * 1.6, y, z: z + (Math.random() - 0.5) * 1.6, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, vz: (Math.random() - 0.5) * 3, t: 0, dur: 0.6 + Math.random() * 0.5, col, size: 0.12 + Math.random() * 0.14 }); }

  // ---- the worms of the Mare ----

  }

  function sfx(name) {

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const t = audioCtx.currentTime;
      const tone = (f0, f1, dur, type = 'square', vol = 0.08, delay = 0) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + delay + dur);
        g.gain.setValueAtTime(vol, t + delay); g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(t + delay); o.stop(t + delay + dur + 0.02);
      };
      switch (name) {
        case 'mine': tone(180, 120, 0.06, 'square', 0.05); break;
        case 'break': tone(300, 80, 0.15, 'sawtooth', 0.08); break;
        case 'place': tone(220, 330, 0.08, 'triangle', 0.08); break;
        case 'hit': tone(240, 90, 0.18, 'sawtooth', 0.1); break;
        case 'hit2': tone(320, 70, 0.25, 'sawtooth', 0.12); tone(600, 200, 0.12, 'square', 0.05, 0.05); break;
        case 'miss': tone(500, 700, 0.12, 'sine', 0.05); break;
        case 'util': tone(440, 660, 0.2, 'triangle', 0.07); break;
        case 'win': tone(440, 440, 0.1, 'square', 0.07); tone(554, 554, 0.1, 'square', 0.07, 0.1); tone(659, 659, 0.25, 'square', 0.08, 0.2); break;
        case 'down': tone(300, 60, 0.4, 'sawtooth', 0.09); break;
        case 'snare': tone(900, 1200, 0.1, 'sine', 0.06); break;
        case 'caught': tone(523, 523, 0.1, 'square', 0.07); tone(659, 659, 0.1, 'square', 0.07, 0.12); tone(784, 784, 0.1, 'square', 0.07, 0.24); tone(1046, 1046, 0.3, 'square', 0.08, 0.36); break;
        case 'level': tone(660, 990, 0.25, 'triangle', 0.08); break;
        case 'quest': tone(520, 780, 0.15, 'triangle', 0.08); tone(780, 1040, 0.25, 'triangle', 0.08, 0.15); break;
        case 'hurt': tone(200, 100, 0.2, 'square', 0.1); break;
        case 'alert': tone(700, 900, 0.08, 'square', 0.05); break;
        case 'fuse': tone(200, 1200, 0.6, 'sawtooth', 0.08); tone(1200, 600, 0.4, 'triangle', 0.08, 0.5); break;
        case 'rumble': tone(70, 38, 0.9, 'sawtooth', 0.12); tone(55, 30, 1.1, 'square', 0.06, 0.2); break;

      }

  }

  function renderFusion(data) {

    if (data && data.table) fusionState.table = data.table;

        `<h4>Kin</h4>` + G.kin.filter(k => !kinsIn.includes(k)).map(k => kinCard(k)).join('') + `<button class="btn ghost" id="f-cancel">Cancel</button>`;

      body.querySelectorAll('.kcard').forEach(c => c.addEventListener('click', () => { fs.slots[fs.picking] = { kin: G.kin.find(k => k.id == c.dataset.kid) }; fs.picking = null; updatePreview(); renderFusion(); }));

      q('f-cancel').addEventListener('click', () => { fs.picking = null; renderFusion(); });
      return;
    }
    const cell = (s, i) => {
      if (!s) return `<div class="fcell empty" data-i="${i}">+</div>`;

})();

// recipes you know, per planet; you start with two on Earth and quest people teach the rest

G.nearTable = function () { const p = this.player, w = this.world; const x0 = Math.floor(p.x), y0 = Math.floor(p.y), z0 = Math.floor(p.z); for (let dx = -5; dx <= 5; dx++) for (let dz = -5; dz <= 5; dz++) for (let dy = -3; dy <= 3; dy++) if (w.getBlock(x0 + dx, y0 + dy, z0 + dz) === B.FUSION || w.getBlock(x0 + dx, y0 + dy, z0 + dz) === B.DARKTABLE) return true; return false; };

  if (!interactable && selInfo && selInfo.snare) { if (this.stealthTarget()) { this.stealthSnare(); } else UI.toast('Snares work in a fight, or sneak up close behind an unaware Kin and press Set snare.'); return; }
  const ev = p.place();
  if (!ev) return;
  if (ev.interact === 'fusion') { if (ev.dark && !Keeps.tableOpen(ev.x, ev.z)) { UI.toast('The warlord\'s table. It will not answer you until this place is yours.', 'bad'); return; } if (!ev.dark && Village.tableChallenge()) return; if (ev.dark && !this.stats.darkTold) { this.stats.darkTold = true; this.explain('The Dark Fusion Table', 'The Kinmaster\'s own table. It is the only one that takes dark materials: Void Crystal, Void Essence and Void Stones. Every fusion that needs a Void Stone, the Void Snare, and anything else made with Void has to be made here.'); } UI.openPanel('fusion', { table: { x: ev.x, y: ev.y, z: ev.z }, dark: !!ev.dark }); return; }
  if (ev.interact === 'portal') { const r = Village.portalHere(ev.x, ev.z); if (r.err) { UI.toast(r.err, 'bad'); return; } UI.openPanel('portal', r.v); return; }
  if (ev.interact === 'chest') { UI.openPanel('chest', { x: ev.x, y: ev.y, z: ev.z }); return; }
  if (ev.interact === 'incubator') { if (!Lab.canUse()) { UI.toast('The incubator is dead until its maker is free.', 'bad'); return; } UI.openPanel('incubator'); return; }
  if (ev.interact === 'door') { UI.sfx(ev.open ? 'place' : 'break'); this.meshPass(99); return; }
  if (ev.kit) { const err = Village.placeKit(ev.kit, ev.item, ev.hit, p); if (err) UI.toast(err, 'bad'); else { p.take(ev.item, 1); UI.sfx('fuse'); UI.renderHotbar(); this.meshPass(99); } return; }
  if (ev.interact === 'camp') {
    const now = performance.now();
    if (this.lastRest && now - this.lastRest < 120000) { UI.toast(`The fire is still warm. Rest again in ${Math.ceil((120000 - (now - this.lastRest)) / 1000)}s.`); return; }
    if (this.kin.every(k => k.hp >= KIN.stats(k).hp)) { UI.toast('Your Kin are already rested.'); return; }
    this.lastRest = now; for (const k of this.kin) k.hp = KIN.stats(k).hp; p.hp = p.maxHp; UI.sfx('caught'); UI.toast('You rest by the fire. Every Kin wakes, whole.', 'good'); return;
  }
  if (ev.interact === 'starmetal') {
    if (this.worldId !== 'earth') { this.fadeTravel('earth'); return; }
    if (p.has('ship')) { UI.toast('The Heart is quiet. Your ship waits on the surface: select it and tap.'); return; }
    if (this.stats.mythicDone) { if (!this.stats.hollowTold) { this.stats.hollowTold = true; this.explain('The hollow Starmetal', 'The pedestal is hollow. Something was torn out of the middle of it: a heart of living metal, the kind that could drive a ship between worlds. Only one person was down here before you. The Kinmaster has it, and he has had someone build something with it.'); } else UI.toast('Hollow. He took its heart for his ship.'); return; }
    UI.toast('Starmetal. Too heavy to lift while the Mythic sleeps on it.'); return;
  }
  if (ev.placed != null) { UI.sfx('place'); UI.renderHotbar(); }
};

// the Starship above the clouds: where to?
G.chooseDestination = function (id) {
  UI.closePanel();
  if (id === 'back') { this.player.flying = true; this.player.y = WH + 10; this.player.vy = -2; return; }
  if (id === this.worldId) { this.player.flying = true; this.player.y = WH + 10; this.player.vy = -2; UI.toast('You are already here. Coming back down.'); return; }
  this.fadeTravel(id);
};
G.fadeTravel = function (target) {
  const f = document.getElementById('fade'); f.style.opacity = 1; this.paused = true; Controls.setEnabled(false);
  setTimeout(() => { this.travel(target); this.paused = false; Controls.setEnabled(true); setTimeout(() => { f.style.opacity = 0; }, 300); }, 900);
};
// ---------- roosts: every village you hold keeps a big carrier Kin; from one, it flies you to any other you have stood in ----------
G.addRoost = function (r) {
  if (!this.stats.roosts) this.stats.roosts = [];
  if (this.stats.roosts.some(x => x.id === r.id)) return;
  this.stats.roosts.push(r);
  if (this.stats.roosts.length === 2 && !this.stats.roostTold) { this.stats.roostTold = true; this.explain('Roosts', 'Every village you hold keeps a Skyhauler, a big carrier Kin, on a roost. Standing in one of your villages, open the Map and pick another village from the Roosts list: it flies you there for a few shards. You can only fly to villages you have already stood in.'); }
};
G.roostHere = function () {
  const v = Village.active, p = this.player; if (!v || v.type === 'deep') return null;
  const st = this.villageState[v.id]; if (!st || !st.freed || Math.hypot(v.x - p.x, v.z - p.z) > 30) return null;
  return (this.stats.roosts || []).find(r => r.id === v.id) || null;
};
G.roostCost = function (r) { const p = this.player; const d = Math.hypot(U.mod(r.x - p.x + WORLD_W / 2, WORLD_W) - WORLD_W / 2, U.mod(r.z - p.z + WORLD_W / 2, WORLD_W) - WORLD_W / 2); return 4 + Math.round(d / 150); };
G.flyTo = function (id) {
  const r = (this.stats.roosts || []).find(x => x.id === id); const here = this.roostHere();
  if (!r || !here || r.id === here.id || (r.world || 'earth') !== this.worldId) return;
  const cost = this.roostCost(r); if (this.shards < cost) { UI.toast(`The Skyhauler wants ${cost} shards for that.`, 'bad'); return; }
  this.shards -= cost; UI.closePanel();
  const f = document.getElementById('fade'); f.style.opacity = 1; this.paused = true; Controls.setEnabled(false); UI.sfx('quest');
  setTimeout(() => {
    const p = this.player, w = this.world; w.ensureAround(Math.floor(r.x / CH), Math.floor(r.z / CH), 3, 9999);
    p.x = r.x; p.z = r.z; const gy = w.groundY(Math.floor(r.x), Math.floor(r.z)); p.y = Math.max(Number.isFinite(gy) ? gy + 1 : -1, Number.isFinite(r.y) ? r.y : -1, SEA + 1) + 0.05; p.vx = p.vy = p.vz = 0; p.fallStart = null; p.gliding = false;
    this.meshPass(999); this.paused = false; Controls.setEnabled(true);
    setTimeout(() => { f.style.opacity = 0; UI.toast(`The Skyhauler sets you down at ${r.name}.`, 'good'); }, 300);
  }, 1100);
};
// ---------- save / load ----------
G.save = function () {
  if (!this.running || !this.world) return false;
  try {
    const data = {
      v: 2, kinV: 2, seed: this.baseSeed, worldId: this.worldId, worlds: Object.assign({}, this.worlds, { [this.worldId]: this.captureWorldState() }), player: this.player.serialize(), kin: this.kin.map(KIN.serialize), box: this.box, eggs: this.eggs, activeIdx: this.activeIdx, xp: this.xp,
      stats: this.stats, questState: this.questState, edits: this.world.serializeEdits(), mythicCaught: this.mythicCaught, shards: this.shards, village: this.village, secure: this.secure, respawnPoint: this.respawnPoint, weather: Weather.serialize(),
      villageState: this.villageState, lastVillage: this.lastVillage, fisherSpot: this.fisherSpot, fisherTarget: this.fisherTarget, founded: this.founded, dayCount: this.dayCount, poiState: this.poiState || {}, pin: this.pin || null, chests: this.chests || {}, npcState: this.npcState || {}, labState: this.labState || {}, skin: this.skin || 'ranger', thirdPerson: !!this.thirdPerson, regrow: (this.world.regrow || []).map(r => ({ x: r.x, y: r.y, z: r.z, t: 0, leaf: !!r.leaf, id: r.id })),
      statues: [...this.world.statues.values()].map(o => { const c = Object.assign({}, o); delete c.model; delete c.mesh; return c; }),
    };
    localStorage.setItem(this.SAVE_KEY, JSON.stringify(data));
    if (this.gameId) Saves.touch(this.gameId, data);
    this.saveFailed = false;
    return true;
  } catch (e) { if (!this.saveFailed) { this.saveFailed = true; UI.toast('Could not save: the browser storage is full. Delete an old game from the Games list.', 'bad'); } return false; }
};
G.load = function () {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(this.SAVE_KEY)); } catch (e) { return false; }
  if (!data || !data.seed) return false;
  this.stats = Object.assign(freshStats(), data.stats || {}); this.questState = data.questState || null; this.xp = data.xp || 0; this.trainerLevel = this.trainerLevelFor(this.xp); this.mythicCaught = !!data.mythicCaught; this.shards = data.shards || 0; this.secure = data.secure || {};
  this.villageState = data.villageState || {}; this.poiState = data.poiState || {}; this.pin = data.pin || null; this.chests = data.chests || {}; this.npcState = data.npcState || {}; this.labState = data.labState || {}; this.amulet = { cd: 0, kind: null, until: 0, charges: 0 }; this.skin = data.skin || 'ranger'; this.thirdPerson = !!data.thirdPerson; this.lastVillage = data.lastVillage || null; this.fisherSpot = data.fisherSpot || null; this.fisherTarget = data.fisherTarget || null; this.founded = data.founded || []; this.dayCount = data.dayCount || 0; this.wasNight = null; this.fisherTried = false;
  this.player = null;
  if (data.v >= 2) {
    this.worlds = data.worlds || {};
    this.setupWorld(data.seed, data.worldId || 'earth');
    this.restoreWorldState(this.worlds[this.worldId]);
  } else {
    // old save: everything was Earth
    this.worlds = {}; this.setupWorld(data.seed, 'earth');
    this.restoreWorldState({ edits: data.edits || [], statues: data.statues || [], time: data.time, regrow: data.regrow || [], respawnPoint: data.respawnPoint || null, village: data.village || null });
    const sp = this.world.spawn; this.camp = { x: Math.floor(sp.x) + 1, y: Math.floor(sp.y), z: Math.floor(sp.z) + 1 };
    this.world.setBlock(this.camp.x, this.camp.y, this.camp.z, B.CAMPFIRE);
  }
  Weather.load(data.weather);
  if (this.worldId === 'earth' && !(data.stats || {}).ruinPlaced && this.world.spawn) { this.world.placeSpawnRuin(); setTimeout(() => { this.stats.ruinPlaced = true; }, 0); }
  this.kin = (data.kin || []).map(KIN.deserialize); this.activeIdx = data.activeIdx || 0; this.box = data.box || []; this.eggs = data.eggs || [];
  while (this.kin.length > this.MAX_KIN) this.box.push(KIN.serialize(this.kin.pop())); // the party is eight now
  this.player.load(data.player);
  { const P = this.player, st = data.stats || {}; if (st.villageFreed && !P.has('shovel')) { P.add('shovel', 1); P.add('hatchet', 1); } if (((st.camp || {}).pick || 0) >= 2 && !P.has('axe_iron')) P.add('axe_iron', 1); } // tools arrived after this save was made
  if (data.kinV !== 2) { // the Kindex arrived: the old one-of-a-kind Kin are let go, everywhere; a fresh starter takes their place
    this.kin = []; this.activeIdx = 0; this.box = []; this.eggs = [];
    for (const id in (this.villageState || {})) if (this.villageState[id].guards) this.villageState[id].guards = [];
    for (const id in (this.labState || {})) { this.labState[id].kin = []; this.labState[id].days = []; }
    const st = KIN.create(KIN.starters(this.baseSeed)[0], 5); this.kin.push(st); this.stats.recipes = { earth: [0, 1], moon: [0], halo: [0] }; this.stats.dex = {};
    setTimeout(() => UI.toast(`The Kin have changed. Every Kin now belongs to a species you can find again, and your old ones have gone back to the wild. ${KIN.name(st)} is with you.`, 'good'), 1500);
  }
  Quests.init(this);
  return true;
};

// ---------- music: one mood per situation ----------
G.updateMusic = function (inBattle) {
  if (!UI.soundOn || !Music.enabled) return;
  const p = this.player, w = this.world;
  let mood;
  const layer = w.layerAt(Math.floor(p.y), Math.floor(p.x), Math.floor(p.z));
  const bx = Math.floor(p.x), bz = Math.floor(p.z); const biome = w.biomeAt(bx, bz);
  const night = Math.cos(w.time * Math.PI * 2) > 0.17 && !w.preset.flatDay;
  const wet = Weather.state.intensity > 0.4 && (Weather.state.kind === 'rain' || Weather.state.kind === 'storm');
  const va = Village.active; const inVillage = va && Math.hypot(va.x - p.x, va.z - p.z) < 22 && this.villageState[va.id] && this.villageState[va.id].freed;
  const volcanic = biome === BIOME.MOUNTAIN && p.y >= 64 && U.vnoise2(bx, bz, 256, WORLD_W, w.seed + 611) > 0.6;
  const chased = (Camps.active && Camps.active.alarm > 0) || (Wild.chaser && Wild.chaser.chase);
  if (inBattle) mood = 'battle';
  else if (chased) mood = 'danger';
  else if (inVillage && this.worldId === 'moon') mood = 'alien';
  else if (this.worldId === 'halo') mood = inVillage ? 'village' : 'halo';
  else if (this.worldId !== 'earth') mood = 'moon';
  else if (biome === BIOME.LOSTWORLD) mood = 'jungle';
  else if (p.mount && p.mountMode === 'air' && !p.onGround && !p.inWater) mood = 'fly';
  else if (p.mount && p.mountMode === 'water' && p.inWater) mood = 'swim';
  else if (p.mount && p.mountMode === 'land' && !p.inWater) mood = 'ride';
  else if (p.underwater) mood = 'deep';
  else if (p.inWater || layer === 'Water') mood = 'water';
  else if (layer === 'Core' || p.inLava || volcanic) mood = p.inLava || layer === 'Core' ? 'fire' : 'volcano';
  else if (layer === 'Mines') mood = 'mines';
  else if (biome === BIOME.SNOW || (biome === BIOME.MOUNTAIN && p.y >= 66)) mood = 'cold';
  else if (layer === 'Sky' || p.y >= SKY_BASE) mood = 'sky';
  else if (inVillage) mood = 'village';
  else if (wet) mood = 'rain';
  else if (night) mood = 'night';
  else mood = 'land';
  Music.update(mood);
  Music.duck(!!UI.panelOpen || this.paused);
};

// ---------- portals ----------
G.portalTo = function (dest) {
  const p = this.player, w = this.world;
  if (dest.world && dest.world !== this.worldId) { UI.closePanel(); UI.toast(`The arch takes you to ${PRESETS[dest.world].name}.`, 'good'); this.fadeTravel(dest.world); return; }
  const wd = (d) => U.mod(d + WORLD_W / 2, WORLD_W) - WORLD_W / 2;
  const x = p.x + wd(dest.spot.x - p.x), z = p.z + wd(dest.spot.z - p.z);
  UI.closePanel();
  const f = document.getElementById('fade'); f.style.opacity = 1; this.paused = true; Controls.setEnabled(false);
  setTimeout(() => {
    w.ensureAround(Math.floor(x / CH), Math.floor(z / CH), 3, 999);
    p.x = x; p.z = z; p.vx = p.vy = p.vz = 0; p.mount = null; p.flying = false;
    Wild.clear(); Wild.chaser = null;
    for (let i = 0; i < 3; i++) Village.update(0.05, p, false); // stamps the village if this is the first visit, so the deck is there to land on
    const gy = dest.spot.y != null && isSolid(w.getBlock(Math.floor(x), dest.spot.y - 1, Math.floor(z))) && w.getBlock(Math.floor(x), dest.spot.y, Math.floor(z)) === B.AIR ? dest.spot.y : w.groundY(Math.floor(x), Math.floor(z)) + 1;
    p.y = gy + 0.2;
    this.meshPass(99); this.paused = false; Controls.setEnabled(true);
    UI.sfx('fuse'); UI.toast(`${dest.name}.`, 'good');
    setTimeout(() => { f.style.opacity = 0; }, 300);
    this.save();
  }, 700);
};

// ---------- chests: storage that survives anything ----------
// the old map: the Lost World is on nobody's chart until somebody gives you theirs
G.giveLostMap = function (from) {
  if (this.stats.lostMap) return false;
  this.stats.lostMap = true; UI.sfx('quest');
  Dialogue.show(from, ['Here. An old map, older than me. There is a ring of cliffs on the far side of the world with a jungle inside, and things in it that walked here before anything else did.', 'There is one way in, a tunnel through the rock. I have marked it. It is a long road; take a mount and plenty of tonics.'], () => UI.toast('The Lost World is on your map and your compass now: 🦖.', 'good'));
  return true;
};
G.damageMul = function () { return (typeof Npcs !== 'undefined' && this.amulet && Npcs.active('skin')) ? 0.5 : 1; };
G.chestKey = function (x, y, z) { return `${this.worldId}:${U.mod(x, WORLD_W)},${y},${U.mod(z, WORLD_W)}`; };
G.chestAt = function (x, y, z, create) { if (!this.chests) this.chests = {}; const k = this.chestKey(x, y, z); if (!this.chests[k] && create) this.chests[k] = { items: {} }; return this.chests[k] || null; };
G.chestStore = function (chest, item, n) { const p = this.player; const info = p.itemInfo(item); if (!info || info.gear || info.obj || item.startsWith('obj:')) return 0; const take = Math.min(p.count(item), n); if (take <= 0) return 0; p.take(item, take); chest.items[item] = (chest.items[item] || 0) + take; return take; };
G.chestTake = function (chest, item, n) { const have = chest.items[item] || 0; const take = Math.min(have, n); if (take <= 0) return 0; if (have - take <= 0) delete chest.items[item]; else chest.items[item] = have - take; this.player.add(item, take); return take; };
G.onChestBroken = function (x, y, z) {
  const k = this.chestKey(x, y, z); const c = this.chests && this.chests[k]; if (!c) return;
  let n = 0; for (const it in c.items) { this.player.add(it, c.items[it]); n += c.items[it]; }
  delete this.chests[k];
  if (n) UI.toast(`The chest comes apart; ${n} things go back in your bag.`);
};

// ---------- the talk camera ----------
G.talkCamera = function (cam, npc, k) {
  const p = this.player;
  const fx = npc.x, fy = npc.y + 1.5 * (npc.model.scale || 1), fz = npc.z; // eye level of a villager, hats and feathers ignored
  let dx = p.x - npc.x, dz = p.z - npc.z; const d = Math.hypot(dx, dz) || 1; dx /= d; dz /= d;
  const sx = -dz, sz = dx; // to the side
  const w = this.world; const free = (x, y, z) => { const b = w.getBlock(Math.floor(x), Math.floor(y), Math.floor(z)); return !isSolid(b) || BLOCKS[b].partial; };
  let cx = fx, cy = fy + 0.15, cz = fz;
  const clear = (x, y, z) => { for (let u = 0.15; u <= 1; u += 0.17) if (!free(fx + (x - fx) * u, fy + (y - fy) * u, fz + (z - fz) * u)) return false; return true; };
  for (let t = 1; t >= 0.25; t -= 0.1) { const x = fx + (dx * 2.6 + sx * 1.0) * t, z = fz + (dz * 2.6 + sz * 1.0) * t; if (free(x, cy, z) && free(x, cy - 0.5, z) && clear(x, cy, z)) { cx = x; cz = z; break; } } // back off until nothing stands between the camera and the face
  if (cx === fx && cz === fz) { for (let t = 1; t >= 0.25; t -= 0.1) { const x = fx + dx * 2.2 * t, z = fz + dz * 2.2 * t; if (free(x, cy, z) && clear(x, cy, z)) { cx = x; cz = z; break; } } } // straight on, if the side is blocked
  const lx = fx - cx, ly = fy - cy, lz = fz - cz; const hd = Math.hypot(lx, lz) || 1;
  const yaw = Math.atan2(-lx, -lz), pitch = Math.atan2(ly, hd);
  let dy = yaw - cam.yaw; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
  return { x: U.lerp(cam.x, cx, k), y: U.lerp(cam.y, cy, k), z: U.lerp(cam.z, cz, k), yaw: cam.yaw + dy * k, pitch: U.lerp(cam.pitch, pitch, k), fov: U.lerp(cam.fov, 55 * Math.PI / 180, k) };
};

// ---------- villages: dawn, guards, founding ----------
G.onDawn = function () {
  const r = Village.dawn();
  for (const line of Lab.dawn()) UI.toast(line, 'good');
  if (r.paid) UI.toast(`Dawn. ${r.paid} village${r.paid > 1 ? 's' : ''} set aside ◆ ${r.sum} for you.`, 'good');
  for (const line of r.lines.slice(0, 3)) UI.toast(line, 'bad');
  if (this.lastVillage && !(this.villageState[this.lastVillage.id] || {}).freed) this.respawnPoint = null;
};
G.stationGuard = function (k) { const err = Village.station(k); if (err) { UI.toast(err, 'bad'); return false; } UI.sfx('place'); UI.toast(`${KIN.name(k)} stands guard at ${Village.active.name}.`, 'good'); return true; };
G.recallGuard = function (i) { const err = Village.recall(i); if (err) { UI.toast(err, 'bad'); return false; } UI.sfx('caught'); return true; };
G.foundVillage = function (table, name) {
  const v = Village.foundVillage(table, name);
  if (!v) { UI.toast('The site is not ready yet.', 'bad'); return null; }
  UI.sfx('quest'); UI.toast(`${v.name} is founded. People are already arriving.`, 'good');
  this.save();
  return v;
};
G.villageAction = function (v, action, arg) {
  const err = action === 'wall' ? Village.upgradeWall(v) : action === 'repair' ? Village.repairWall(v) : action === 'expand' ? Village.expand(v) : action === 'build' ? Village.build(v, arg) : action === 'dome' ? Village.raiseDome(v) : 'Unknown action.';
  if (err) { UI.toast(err, 'bad'); return false; }
  UI.sfx('fuse'); UI.renderHotbar(); this.meshPass(99); this.save(); return true;
};

window.addEventListener('DOMContentLoaded', () => {
  try { G.init(); } catch (e) { document.body.innerHTML = `<div style="color:#fff;padding:20px;font-family:sans-serif"><h2>Stratakin could not start</h2><p>${e.message}</p><p>This game needs WebGL. Try another browser or device.</p></div>`; console.error(e); }
});
